name: Validate YAML

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PyYAML if needed
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml

      - name: Validate YAML & Blueprint schemas
        run: python3 .github/scripts/validate_yaml.py
