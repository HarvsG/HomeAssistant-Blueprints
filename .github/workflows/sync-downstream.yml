name: Sync Mirrors (Gists & Forum)

on:
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - ".github/scripts/sync_downstream.py"
      - ".github/workflows/sync-downstream.yml"
  workflow_dispatch:
    inputs:
      sync_forum:
        description: "Also check/sync inline YAML blocks on community.home-assistant.io"
        type: boolean
        default: true
      force_overwrite:
        description: "Force overwrite even if target Gist or Forum YAML was edited out-of-band"
        type: boolean
        default: false

concurrency:
  group: sync-downstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync YAML to Gists & HA Forum
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for conflict check)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync downstream mirrors
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          DISCOURSE_USER_API_KEY: ${{ secrets.DISCOURSE_USER_API_KEY }}
          DISCOURSE_USER_API_CLIENT_ID: ${{ secrets.DISCOURSE_USER_API_CLIENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          SYNC_FORUM: ${{ inputs.sync_forum != false }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite == true }}
        run: python3 .github/scripts/sync_downstream.py
